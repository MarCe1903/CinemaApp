name: cinema-app
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema-db
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/setup-database.ps1 first}
    ports:
      - '127.0.0.1:14333:1433'
    volumes:
      - cinema-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  cinema-data:
